[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-stratcom"
dynamic = ["version"]
description = "Operations, structure intelligence and timers for Alliance Auth"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Erik Kalkoken", email = "kalkoken87@gmail.com" }]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "allianceauth-app-utils>=1.33.2",
    "allianceauth>=5,<6",
    "dhooks_lite>=1.1",
    "discordproxy @ git+https://github.com/Redone0001/discordproxy.git@41b0bbd0377bcb426f11675d59e45ddf14f0827a",
    "django-eveuniverse>=2",
    "django-eveonline-sde>=0.2.0,<0.3",
    "django-multiselectfield",
    "puremagic",
    "redis-simple-mq>=1.1",
    "requests",
    "cryptography>=43",
    "urllib3>=2.2,<3",
]

[project.optional-dependencies]
test = ["coverage", "factory_boy"]

[project.urls]
Homepage = "https://github.com/Redone0001/aa-structuretimers"

[tool.setuptools.dynamic]
version = {attr = "aa_stratcom.__version__"}

[tool.setuptools.packages.find]
include = ["aa_stratcom*", "structuretimers*"]

[tool.setuptools.package-data]
aa_stratcom = ["templates/**/*", "static/**/*", "locale/**/*", "data/**/*", "tests/**/*.json", "tests/**/*.txt", "tests/**/*.jpg", "tests/**/*.cjs", "tests/fixtures/**/*.html", "tools/*.sql"]

[tool.isort]
profile = "black"
multi_line_output = 3
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "ALLIANCEAUTH",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
known_allianceauth = ["allianceauth", "app_utils"]
known_django = ["django", "esi", "eveuniverse"]

[tool.pylint.'MASTER']
ignore-patterns = ["__init__.py", "auth_hooks.py", "apps.py", "admin.py"]
ignore-paths = ["^.*/tests/.*$", "^.*/migrations/.*$"]

[tool.pylint.'BASIC']
good-names = ["i", "j", "k", "x", "y", "z", "ex", "id"]

# Django choice enums inherit framework classes rather than application complexity.
[tool.pylint.'DESIGN']
ignored-parents = ["django.db.models.enums.TextChoices", "django.db.models.enums.IntegerChoices"]

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "cyclic-import",
    "import-outside-toplevel",
    "imported-auth-user",
    "no-member",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "fixme",
    "protected-access",
    # "redefined-builtin",
    # "too-many-instance-attributes",
]
