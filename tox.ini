[flake8]
exclude = .git, *migrations*, .tox, dist, htmlcov
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E203, E231, E501, W503, W291, W293

[tox]
envlist = {py310, py311, py312}-django52-{sde02,sde20}, pylint

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local

deps =
    allianceauth>=5,<6
    sde02: django-eveonline-sde==0.2.0
    sde20: django-eveonline-sde==2.0.0

extras =
    test

commands_pre=
    pip list

commands=
    coverage run runtests.py structuretimers -v 2
    coverage xml
    coverage report

[testenv:pylint]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local
deps=
    allianceauth>=5,<6
    django-eveonline-sde==2.0.0
    pylint
    pylint-django

commands=
    pylint --load-plugins pylint_django structuretimers
