[flake8]
exclude = .git, *migrations*, .tox, dist, htmlcov
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E203, E231, E501, W503, W291, W293

[tox]
envlist = {py310, py311, py312}-django52, pylint

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local

deps =
    allianceauth>=5,<6

extras =
    test

commands_pre=
    pip list

commands=
    coverage run runtests.py aa_stratcom -v 2
    coverage xml
    coverage report

[testenv:pylint]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local
deps=
    allianceauth>=5,<6
    pylint
    pylint-django

commands=
    pylint --load-plugins pylint_django aa_stratcom

[testenv:coexist]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.side_by_side
deps =
    allianceauth>=5,<6
    aa-structuretimers @ git+https://github.com/Redone0001/aa-structuretimers.git@dd3a34aa1d164c67c7bd226428c6698559685fc4
extras =
    test
commands =
    python -m django test aa_stratcom --noinput -v 1

[testenv:upstream]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.side_by_side
deps =
    allianceauth>=5,<6
    aa-structuretimers @ git+https://github.com/AllianceAuth-Apps/aa-structuretimers.git@e20f9cec32cb49f025a69c91820a59a8781c009c
extras =
    test
commands =
    python -m django test aa_stratcom.tests.test_upstream_import --noinput -v 1
