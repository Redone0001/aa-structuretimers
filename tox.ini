[flake8]
exclude = .git, *migrations*, .tox, dist, htmlcov
max-line-length = 88
select = C,E,F,W,B,B950
ignore = E203, E231, E501, W503, W291, W293

[tox]
envlist = {py310, py311, py312}-django52-{sde02,sde20}, pylint

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local

deps =
    allianceauth>=5,<6
    sde02: django-eveonline-sde==0.2.0
    sde20: django-eveonline-sde==2.0.0

extras =
    test

commands_pre=
    pip list

commands=
    coverage run runtests.py aa_stratcom -v 2
    coverage xml
    coverage report

[testenv:pylint]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.local
deps=
    allianceauth>=5,<6
    django-eveonline-sde==2.0.0
    pylint
    pylint-django

commands=
    pylint --load-plugins pylint_django aa_stratcom

[testenv:coexist-sde{02,20}]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.side_by_side
deps =
    allianceauth>=5,<6
    aa-structuretimers @ git+https://github.com/Redone0001/aa-structuretimers.git@e6f460e9235cf42a366cb5d65f2f1c5098ce8896
    sde02: django-eveonline-sde==0.2.0
    sde20: django-eveonline-sde==2.0.0
extras =
    test
commands =
    python -m django test aa_stratcom structuretimers --noinput -v 1

[testenv:upstream]
setenv =
    DJANGO_SETTINGS_MODULE = testauth.settings_aa5.side_by_side
deps =
    allianceauth>=5,<6
    django-eveonline-sde==2.0.0
    aa-structuretimers @ git+https://github.com/AllianceAuth-Apps/aa-structuretimers.git@e20f9cec32cb49f025a69c91820a59a8781c009c
extras =
    test
commands =
    python -m django test aa_stratcom.tests.test_upstream_import --noinput -v 1
