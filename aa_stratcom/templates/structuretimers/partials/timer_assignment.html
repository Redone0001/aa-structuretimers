{% load i18n %}
<div class="timer-assignment">
    <div class="operation-assignment-links">
        {% for op in assigned_operations %}<a href="{{ op.get_absolute_url }}">{{ op.name }}</a>{% if not forloop.last %}<br>{% endif %}{% empty %}<span class="text-muted">{% translate "Unassigned" %}</span>{% endfor %}
    </div>
    {% if can_assign_operation %}
        <label for="timer-operation-{{ timer.pk }}" class="visually-hidden">{% translate "Assign to operations" %}</label>
        <select id="timer-operation-{{ timer.pk }}" class="form-select form-select-sm timer-operation" multiple
                data-placeholder="{% translate 'Choose operations' %}" data-url="{% url 'structuretimers:assign' timer.pk %}">
            {% for op in assigned_operations %}<option value="{{ op.pk }}" selected>{{ op.name }}</option>{% endfor %}
        </select>
        <span class="small assignment-status" role="status" aria-live="polite"></span>
    {% endif %}
</div>
