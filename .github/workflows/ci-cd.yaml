name: CI/CD Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Verify that redis is up
        run: redis-cli ping

      - name: Run Pylint
        run: |
          pip install tox
          tox -e pylint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["42", "52"]
        python-version: ["10", "11", "12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.${{ matrix.python-version }}"

      - name: Install redis
        uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: latest

      - name: Verify that redis is up
        run: redis-cli ping

      - name: Run Tests
        run: |
          pip install tox
          tox -e py3${{ matrix.python-version }}-django${{ matrix.django-version }}

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: AllianceAuth-Apps/aa-structuretimers

  deployment-ready:
    name: deployment-ready
    runs-on: ubuntu-latest
    needs: [pre-commit, pylint, test]
    if: ${{ always() }}
    steps:
      - name: Require every validation job to pass
        env:
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          PYLINT_RESULT: ${{ needs.pylint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$PRE_COMMIT_RESULT" = success
          test "$PYLINT_RESULT" = success
          test "$TEST_RESULT" = success

  publish:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Flit
        run: pip install flit

      - name: Build and Publish
        run: flit publish
        env:
          FLIT_USERNAME: ${{ secrets.FLIT_USERNAME }}
          FLIT_PASSWORD: ${{ secrets.FLIT_PASSWORD }}
